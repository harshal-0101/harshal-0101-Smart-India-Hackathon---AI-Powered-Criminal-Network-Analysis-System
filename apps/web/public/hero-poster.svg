<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0F1722" />
      <stop offset="70%" stop-color="#0B0D10" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(34, 211, 199, 0.07)" stroke-width="1"/>
    </pattern>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3C7" stop-opacity="0" />
      <stop offset="50%" stop-color="#22D3C7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#22D3C7" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Road & City Perspective Vectors (Simulated CCTV Camera View) -->
  <line x1="200" y1="1080" x2="960" y2="460" stroke="#1F2937" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="1720" y1="1080" x2="960" y2="460" stroke="#1F2937" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="960" y1="1080" x2="960" y2="460" stroke="#374151" stroke-width="1.5" stroke-dasharray="16 12"/>

  <!-- Optical Targeting Reticle Center -->
  <circle cx="960" cy="460" r="160" fill="none" stroke="#22D3C7" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 8"/>
  <circle cx="960" cy="460" r="80" fill="none" stroke="#22D3C7" stroke-width="1" opacity="0.6"/>
  <circle cx="960" cy="460" r="4" fill="#22D3C7" opacity="0.9"/>
  <line x1="760" y1="460" x2="1160" y2="460" stroke="#22D3C7" stroke-width="1" opacity="0.4"/>
  <line x1="960" y1="260" x2="960" y2="660" stroke="#22D3C7" stroke-width="1" opacity="0.4"/>

  <!-- OpenCV Bounding Box 1: Primary Suspect POI-9042 -->
  <rect x="1100" y="380" width="180" height="240" fill="rgba(34, 211, 199, 0.05)" stroke="#22D3C7" stroke-width="2"/>
  <!-- Reticle Corners -->
  <path d="M 1095 395 L 1095 375 L 1115 375" fill="none" stroke="#22D3C7" stroke-width="3"/>
  <path d="M 1265 375 L 1285 375 L 1285 395" fill="none" stroke="#22D3C7" stroke-width="3"/>
  <path d="M 1095 605 L 1095 625 L 1115 625" fill="none" stroke="#22D3C7" stroke-width="3"/>
  <path d="M 1265 625 L 1285 625 L 1285 605" fill="none" stroke="#22D3C7" stroke-width="3"/>
  <!-- Tag Banner -->
  <rect x="1100" y="348" width="180" height="26" fill="#0B0D10" stroke="#22D3C7" stroke-width="1"/>
  <text x="1110" y="365" fill="#22D3C7" font-family="monospace" font-size="12" font-weight="bold">TARGET_ID #POI-9042</text>
  <text x="1110" y="405" fill="#E2E8F0" font-family="monospace" font-size="11">MATCH: 98.6%</text>
  <text x="1110" y="425" fill="#94A3B8" font-family="monospace" font-size="10">RE-ID: SECTOR 4</text>
  <text x="1110" y="605" fill="#E24B4A" font-family="monospace" font-size="11" font-weight="bold">ALERT: HIGH RISK</text>

  <!-- OpenCV Bounding Box 2: Vehicle Intercept -->
  <rect x="520" y="560" width="280" height="180" fill="rgba(239, 159, 39, 0.06)" stroke="#EF9F27" stroke-width="2"/>
  <rect x="520" y="530" width="220" height="25" fill="#0B0D10" stroke="#EF9F27" stroke-width="1"/>
  <text x="530" y="547" fill="#EF9F27" font-family="monospace" font-size="12" font-weight="bold">ANPR: DL-03-CB-9011</text>
  <text x="530" y="585" fill="#E2E8F0" font-family="monospace" font-size="11">VELOCITY: 52 KM/H</text>
  <text x="530" y="605" fill="#EF9F27" font-family="monospace" font-size="10">FLAG: GEOFENCE BREACH</text>

  <!-- Relational Edge Connecting Entity to Vehicle -->
  <line x1="1100" y1="480" x2="800" y2="620" stroke="#E24B4A" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="950" cy="550" r="4" fill="#E24B4A"/>
  <rect x="880" y="535" width="140" height="20" fill="#0B0D10" stroke="#E24B4A" stroke-width="1"/>
  <text x="890" y="549" fill="#E24B4A" font-family="monospace" font-size="10">LINK: CDR CO-LOC</text>

  <!-- Top Camera Meta HUD -->
  <rect x="40" y="40" width="380" height="60" fill="#0B0D10" stroke="#1F2937" stroke-width="1" rx="4"/>
  <circle cx="60" cy="70" r="6" fill="#22D3C7"/>
  <text x="76" y="65" fill="#FFFFFF" font-family="monospace" font-size="13" font-weight="bold">CAM_FEED: ND-MUNICIPAL-04</text>
  <text x="76" y="83" fill="#22D3C7" font-family="monospace" font-size="11">LIVE · 60.0 FPS · 1080P · LATENCY 14MS</text>

  <rect x="1500" y="40" width="380" height="60" fill="#0B0D10" stroke="#1F2937" stroke-width="1" rx="4"/>
  <text x="1520" y="65" fill="#94A3B8" font-family="monospace" font-size="12">TIME: 2026-09-05 15:14:32 IST</text>
  <text x="1520" y="83" fill="#22D3C7" font-family="monospace" font-size="11">SENTINEL-X AI SURVEILLANCE ENGINE</text>

